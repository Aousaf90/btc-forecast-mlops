# ---------------------------------------------------------------------------
# CI/CD for the BTC forecasting API (B3 + B4).
#
#   push to main / pull request  ->  lint (flake8 + black) and pytest
#   push to main only            ->  build and push to Docker Hub, tagged with
#                                    both the commit SHA and `latest`
#
# Prophet makes image builds slow, so the Docker job uses GitHub Actions cache
# via buildx (cache-from/cache-to type=gha). The dependency layer is only
# rebuilt when requirements.txt changes; an app-code-only commit reuses it.
# ---------------------------------------------------------------------------
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: btc-forecast-api
  PYTHON_VERSION: "3.10"

# A new push to the same branch cancels the previous run rather than queueing
# behind it -- Prophet builds are slow enough that stale runs waste real time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ lint
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Linters only -- no need to install Prophet to run flake8.
      - name: Install linters
        run: python -m pip install --upgrade pip flake8==7.1.1 black==24.10.0

      - name: flake8
        run: flake8 src/ app/ tests/ dags/ kubeflow/

      - name: black --check
        run: black --check --diff src/ app/ tests/ dags/ kubeflow/

  # ------------------------------------------------------------------ test
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite trains real Prophet models against synthetic data in tmp_path,
      # so it needs no network access and no committed model artifacts.
      - name: Run pytest
        run: pytest tests/ -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 14

  # --------------------------------------------------------- build and push
  docker:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Only publish from main. Pull requests build nothing, so a fork PR can
    # never reach the registry credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, so the Prophet install
          # layer is restored instead of rebuilt on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke-test the pushed image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          docker run -d --name smoke -p 5000:5000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health > /dev/null 2>&1; then
              echo "health check passed"
              curl -s http://localhost:5000/health
              docker rm -f smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::container failed to become healthy"
          docker logs smoke
          docker rm -f smoke
          exit 1

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| Tag | Value |"
            echo "|---|---|"
            echo "| Repository | \`${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}\` |"
            echo "| Commit SHA | \`${{ github.sha }}\` |"
            echo "| Tags | \`latest\`, \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
