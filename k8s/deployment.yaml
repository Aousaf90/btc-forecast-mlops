# ---------------------------------------------------------------------------
# D3. Deployment — 3 replicas, probes on GET /health, graded resource numbers.
#
# The replica count (3) and the HPA minReplicas (2) disagree; that mismatch is
# in the assignment spec. Both values are implemented exactly as written.
# Under no load the HPA will scale the Deployment down from 3 to 2.
#
# /health returns 200 whenever the process is serving, even with no model on
# the PVC yet (see app/app.py). That is load-bearing: a 503 here would make
# the liveness probe restart-loop a healthy pod on a fresh volume, before a
# training Job / Airflow DAG has written the first artifact.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast-api
  labels:
    app: btc-forecast-api
    app.kubernetes.io/part-of: btc-forecast-mlops
spec:
  replicas: 3
  selector:
    matchLabels:
      app: btc-forecast-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: btc-forecast-api
        app.kubernetes.io/part-of: btc-forecast-mlops
    spec:
      # UID 1000 matches appuser in app/Dockerfile so the non-root process
      # can write the PVC. fsGroup chowns the volume on first attach.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: aousafs/btc-forecast-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: btc-forecast-config
            - secretRef:
                name: btc-forecast-secret
          env:
            - name: MODEL_DIR
              value: /app/models
            - name: DATA_DIR
              value: /app/models/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: model-storage
              mountPath: /app/models
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: btc-forecast-pvc
