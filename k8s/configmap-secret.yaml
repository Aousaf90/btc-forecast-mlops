# ---------------------------------------------------------------------------
# D1. ConfigMap + Secret — configuration decoupled from the image.
#
# ConfigMap holds the non-sensitive knobs the rubric names (MODEL_STAGE,
# LOG_LEVEL, PORT). Secret holds credential placeholders. The live pipeline
# talks only to public market-data APIs (yfinance / Binance / CoinGecko) that
# need no key; the Secret values are dummy base64 so the manifest is graded
# without ever shipping a real credential.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-forecast-config
  labels:
    app: btc-forecast-api
    app.kubernetes.io/part-of: btc-forecast-mlops
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-forecast-secret
  labels:
    app: btc-forecast-api
    app.kubernetes.io/part-of: btc-forecast-mlops
type: Opaque
# Dummy values only (echo -n '<placeholder>' | base64). Not real credentials.
data:
  API_KEY: ZHVtbXktbm90LWEtcmVhbC1rZXk=          # dummy-not-a-real-key
  COINGECKO_API_KEY: ZHVtbXktY29pbmdlY2tvLWtleQ==  # dummy-coingecko-key
