# ---------------------------------------------------------------------------
# D4. Service — ClusterIP for in-cluster traffic (Ingress, Airflow reload)
# and NodePort for host access. Both map port 80 -> targetPort 5000.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api
  labels:
    app: btc-forecast-api
    app.kubernetes.io/part-of: btc-forecast-mlops
spec:
  type: ClusterIP
  selector:
    app: btc-forecast-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: btc-forecast-api-nodeport
  labels:
    app: btc-forecast-api
    app.kubernetes.io/part-of: btc-forecast-mlops
spec:
  type: NodePort
  selector:
    app: btc-forecast-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
      nodePort: 30080
